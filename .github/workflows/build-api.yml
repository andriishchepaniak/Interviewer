name: Build API (InterviewerApi)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'InterviewerApi/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'InterviewerApi/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./Interviewer/InterviewerApi/Interviewer.Api.csproj

    - name: Build API
      run: dotnet build ./Interviewer/InterviewerApi/Interviewer.Api.csproj --no-restore --configuration Release