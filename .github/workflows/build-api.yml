name: Build API (InterviewerApi)

on:
  push:
    branches: [ "main" ]
    # Only run this workflow if files in the InterviewerApi folder change
    paths:
      - 'InterviewerApi/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'InterviewerApi/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Update to match your version

    - name: Restore dependencies
      run: dotnet restore ./InterviewerApi/InterviewerApi.csproj

    - name: Build API
      run: dotnet build ./InterviewerApi/InterviewerApi.csproj --no-restore --configuration Release