name: Build and Deploy API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./Interviewer/InterviewApi/Interviewer.Api.csproj

    - name: Build API
      run: dotnet build ./Interviewer/InterviewApi/Interviewer.Api.csproj --no-restore --configuration Release

    - name: Publish API
      run: dotnet publish ./Interviewer/InterviewApi/Interviewer.Api.csproj --no-build --configuration Release --output ./publish

    - name: Deploy to Azure Web App
      if: github.ref == 'refs/heads/main'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'interviewer-api-dev'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish