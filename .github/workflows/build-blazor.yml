name: Build Blazor (Interviewer)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install npm dependencies
      run: npm install
      working-directory: ./Interviewer/Interviewer

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./Interviewer/Interviewer/Interviewer.csproj

    - name: Build Blazor
      run: dotnet build ./Interviewer/Interviewer/Interviewer.csproj --no-restore --configuration Release