name: Build Blazor (Interviewer)

on:
  push:
    branches: [ "main" ]
    # Only run this workflow if files in the Interviewer folder change
    paths:
      - 'Interviewer/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Interviewer/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Update to match your version

    - name: Restore dependencies
      run: dotnet restore ./Interviewer/Interviewer/Interviewer.csproj

    - name: Build Blazor
      run: dotnet build ./Interviewer/Interviewer/Interviewer.csproj --no-restore --configuration Release