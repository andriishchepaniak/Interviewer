name: Build and Deploy Blazor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install npm dependencies
      run: npm install
      working-directory: ./Interviewer/Interviewer

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./Interviewer/Interviewer/Interviewer.csproj

    - name: Build Blazor
      run: dotnet build ./Interviewer/Interviewer/Interviewer.csproj --no-restore --configuration Release

    - name: Publish Blazor
      run: dotnet publish ./Interviewer/Interviewer/Interviewer.csproj --no-build --configuration Release --output ./publish

    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
        action: "upload"
        app_location: "./publish/wwwroot"
        skip_app_build: true